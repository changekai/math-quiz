<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>九九乘法表挑戰 🔢</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d1a;
      --card: #13132a;
      --border: rgba(255,255,255,0.08);
      --purple: #8b5cf6;
      --pink: #ec4899;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #e2e8f0;
      --muted: rgba(255,255,255,0.35);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
      letter-spacing: 2px;
    }

    .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 2rem; }

    /* ── 設定面板 ── */
    #setup-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      margin-bottom: 1.5rem;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }

    .setting-row label { color: var(--muted); font-size: 0.9rem; }

    .setting-row select, .setting-row input[type=number] {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.4rem 0.8rem;
      font-size: 0.9rem;
      width: 120px;
    }

    .range-row { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
    .range-inputs { display: flex; gap: 0.5rem; align-items: center; }
    .range-inputs span { color: var(--muted); }

    .start-btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .start-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .start-btn:active { transform: translateY(0); }

    /* ── 遊戲面板 ── */
    #game-panel { display: none; width: 100%; max-width: 480px; }

    /* 頂部資訊列 */
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.7rem 1.2rem;
    }

    .info-item { text-align: center; }
    .info-item .val { font-size: 1.4rem; font-weight: bold; }
    .info-item .lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    #timer-val { color: var(--yellow); }
    #score-val { color: var(--purple); }
    #streak-val { color: var(--pink); }
    #lives-val  { color: var(--red); font-size: 1.1rem; }

    /* 進度條 */
    .progress-wrap {
      background: rgba(255,255,255,0.05);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    /* 題目卡 */
    .question-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      margin-bottom: 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .question-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at center, rgba(139,92,246,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .question-text {
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 30px rgba(139,92,246,0.4);
    }

    .question-text .op { color: var(--muted); font-size: 2rem; margin: 0 0.5rem; }
    .question-text .ans { color: var(--purple); }

    .hint { color: var(--muted); font-size: 0.8rem; margin-top: 0.5rem; }

    /* 懲罰動畫 */
    .punishment-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(239,68,68,0.15);
      backdrop-filter: blur(2px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
    }
    .punishment-overlay.show { display: flex; }
    .punishment-text {
      font-size: 2rem;
      font-weight: bold;
      color: var(--red);
      text-shadow: 0 0 20px rgba(239,68,68,0.8);
      animation: pulse 0.5s ease infinite alternate;
    }
    .punishment-detail {
      color: rgba(255,255,255,0.7);
      font-size: 1.1rem;
      text-align: center;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.05); }
    }

    /* 選項 / 輸入 */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    .choice-btn {
      background: rgba(255,255,255,0.04);
      border: 2px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 1.4rem;
      font-weight: bold;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .choice-btn:hover { background: rgba(139,92,246,0.15); border-color: var(--purple); }
    .choice-btn.correct { background: rgba(34,197,94,0.2); border-color: var(--green); color: var(--green); }
    .choice-btn.wrong   { background: rgba(239,68,68,0.2);  border-color: var(--red);   color: var(--red);   }

    /* 輸入模式 */
    .input-row {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1.2rem;
    }

    #answer-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1.6rem;
      font-weight: bold;
      padding: 0.7rem 1rem;
      text-align: center;
      transition: border-color 0.2s;
    }
    #answer-input:focus { outline: none; border-color: var(--purple); }
    #answer-input.correct { border-color: var(--green); background: rgba(34,197,94,0.1); }
    #answer-input.wrong   { border-color: var(--red);   background: rgba(239,68,68,0.1); }

    #submit-btn {
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      padding: 0 1.5rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #submit-btn:hover { opacity: 0.85; }

    /* 回饋訊息 */
    .feedback {
      text-align: center;
      font-size: 1rem;
      font-weight: bold;
      min-height: 1.5rem;
      margin-bottom: 0.5rem;
      transition: all 0.2s;
    }
    .feedback.correct { color: var(--green); }
    .feedback.wrong   { color: var(--red); }

    /* 懲罰列表 */
    .punishment-log {
      background: var(--card);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 14px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .punishment-log h3 { color: var(--red); font-size: 0.85rem; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
    .punishment-log ul  { list-style: none; }
    .punishment-log li  { color: rgba(255,255,255,0.6); font-size: 0.85rem; padding: 0.2rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

    /* 控制按鈕 */
    .ctrl-row { display: flex; gap: 0.8rem; }
    .ctrl-btn {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.6rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ctrl-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

    /* 結果面板 */
    #result-panel {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .result-grade {
      font-size: 4rem;
      margin-bottom: 0.5rem;
    }
    .result-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 1.5rem; }

    .result-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-box {
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 1rem;
    }
    .stat-box .sv { font-size: 1.8rem; font-weight: bold; color: var(--purple); }
    .stat-box .sl { font-size: 0.75rem; color: var(--muted); }

    .punishment-summary {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .punishment-summary h3 { color: var(--red); margin-bottom: 0.5rem; font-size: 0.85rem; }
    .punishment-summary li { color: rgba(255,255,255,0.65); font-size: 0.85rem; padding: 0.2rem 0; }

    .play-again-btn {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      border: none; border-radius: 12px;
      color: #fff; font-size: 1rem; font-weight: bold;
      cursor: pointer; letter-spacing: 1px;
    }
    .play-again-btn:hover { opacity: 0.9; }

    /* shake animation */
    .shake-anim { animation: shakeIt 0.4s ease; }
    @keyframes shakeIt {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-5px); }
      80%      { transform: translateX(5px); }
    }
  </style>
</head>
<body>

<!-- 懲罰動畫 overlay -->
<div class="punishment-overlay" id="punishment-overlay">
  <div class="punishment-text" id="punishment-text">❌ 答錯了！</div>
  <div class="punishment-detail" id="punishment-detail"></div>
</div>

<h1>九九乘法表</h1>
<p class="subtitle">答錯有懲罰 · 挑戰你的速度！</p>

<!-- 設定面板 -->
<div id="setup-panel">
  <div class="setting-row">
    <label>🎮 遊戲模式</label>
    <select id="mode-select">
      <option value="choice">選擇題</option>
      <option value="input">填寫答案</option>
    </select>
  </div>
  <div class="setting-row">
    <label>💀 懲罰類型</label>
    <select id="punishment-select">
      <option value="pushup">伏地挺身</option>
      <option value="squat">深蹲</option>
      <option value="jump">跳繩</option>
      <option value="drink">喝水</option>
      <option value="custom">自訂</option>
    </select>
  </div>
  <div class="setting-row">
    <label>🔢 每題懲罰</label>
    <input type="number" id="punishment-count" value="5" min="1" max="50" />
  </div>
  <div class="setting-row range-row">
    <label>📐 乘數範圍</label>
    <div class="range-inputs">
      <input type="number" id="range-min" value="2" min="1" max="9" style="width:60px" />
      <span>到</span>
      <input type="number" id="range-max" value="9" min="1" max="9" style="width:60px" />
    </div>
  </div>
  <div class="setting-row">
    <label>⏱️ 答題時限 (秒)</label>
    <input type="number" id="time-limit" value="10" min="5" max="60" />
  </div>
  <div class="setting-row">
    <label>❓ 題目數量</label>
    <input type="number" id="total-q" value="20" min="5" max="81" />
  </div>
  <div class="setting-row">
    <label>❤️ 生命數</label>
    <input type="number" id="lives-count" value="3" min="1" max="10" />
  </div>
  <button class="start-btn" onclick="startGame()">🚀 開始挑戰！</button>
</div>

<!-- 遊戲面板 -->
<div id="game-panel">
  <div class="info-bar">
    <div class="info-item">
      <div class="val" id="timer-val">10</div>
      <div class="lbl">秒</div>
    </div>
    <div class="info-item">
      <div class="val" id="score-val">0</div>
      <div class="lbl">分數</div>
    </div>
    <div class="info-item">
      <div class="val" id="streak-val">🔥0</div>
      <div class="lbl">連勝</div>
    </div>
    <div class="info-item">
      <div class="val" id="lives-val">❤️❤️❤️</div>
      <div class="lbl">生命</div>
    </div>
    <div class="info-item">
      <div class="val" id="qnum-val">1/20</div>
      <div class="lbl">題數</div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>

  <div class="question-card" id="question-card">
    <div class="question-text" id="question-text"></div>
    <div class="hint" id="time-hint"></div>
  </div>

  <div class="feedback" id="feedback"></div>

  <!-- 選擇題模式 -->
  <div class="choices-grid" id="choices-area"></div>

  <!-- 輸入模式 -->
  <div class="input-row" id="input-area" style="display:none">
    <input type="number" id="answer-input" placeholder="?" autocomplete="off" />
    <button id="submit-btn" onclick="submitInput()">確認</button>
  </div>

  <div class="punishment-log" id="punishment-log" style="display:none">
    <h3>⚠️ 待執行懲罰</h3>
    <ul id="punishment-list"></ul>
  </div>

  <div class="ctrl-row">
    <button class="ctrl-btn" onclick="skipQuestion()">⏭ 跳過</button>
    <button class="ctrl-btn" onclick="endGame()">🏳 結束</button>
  </div>
</div>

<!-- 結果面板 -->
<div id="result-panel">
  <div class="result-grade" id="result-grade">🏆</div>
  <div class="result-title" id="result-title">挑戰完成！</div>
  <div class="result-stats">
    <div class="stat-box"><div class="sv" id="res-correct">0</div><div class="sl">答對題數</div></div>
    <div class="stat-box"><div class="sv" id="res-wrong">0</div><div class="sl">答錯題數</div></div>
    <div class="stat-box"><div class="sv" id="res-score">0</div><div class="sl">最終分數</div></div>
    <div class="stat-box"><div class="sv" id="res-streak">0</div><div class="sl">最高連勝</div></div>
  </div>
  <div class="punishment-summary" id="res-punishment" style="display:none">
    <h3>💪 你的懲罰清單</h3>
    <ul id="res-punishment-list"></ul>
  </div>
  <button class="play-again-btn" onclick="playAgain()">🔄 再來一次</button>
</div>

<script>
// ── 狀態 ──
let state = {};
let timer = null;

const PUNISHMENTS = {
  pushup: '伏地挺身',
  squat:  '深蹲',
  jump:   '跳繩',
  drink:  '喝水（杯）',
  custom: '自訂懲罰',
};

function getSettings() {
  return {
    mode:        document.getElementById('mode-select').value,
    punishment:  PUNISHMENTS[document.getElementById('punishment-select').value],
    punishCount: parseInt(document.getElementById('punishment-count').value),
    rangeMin:    parseInt(document.getElementById('range-min').value),
    rangeMax:    parseInt(document.getElementById('range-max').value),
    timeLimit:   parseInt(document.getElementById('time-limit').value),
    totalQ:      parseInt(document.getElementById('total-q').value),
    lives:       parseInt(document.getElementById('lives-count').value),
  };
}

function startGame() {
  const s = getSettings();
  state = {
    ...s,
    current: 0,
    score: 0,
    streak: 0,
    maxStreak: 0,
    correct: 0,
    wrong: 0,
    lives: s.lives,
    punishments: [],
    timeLeft: s.timeLimit,
    answered: false,
    q: null,
  };
  document.getElementById('setup-panel').style.display = 'none';
  document.getElementById('game-panel').style.display = 'block';
  nextQuestion();
}

function generateQuestion() {
  const a = Math.floor(Math.random() * (state.rangeMax - state.rangeMin + 1)) + state.rangeMin;
  const b = Math.floor(Math.random() * 9) + 1;
  return { a, b, answer: a * b };
}

function generateChoices(correct) {
  const choices = new Set([correct]);
  while (choices.size < 4) {
    const offset = Math.floor(Math.random() * 20) - 10;
    const v = correct + offset;
    if (v > 0 && v !== correct) choices.add(v);
  }
  return [...choices].sort(() => Math.random() - 0.5);
}

function nextQuestion() {
  if (state.current >= state.totalQ || state.lives <= 0) {
    endGame();
    return;
  }
  clearInterval(timer);
  state.answered = false;
  state.timeLeft = state.timeLimit;
  state.q = generateQuestion();
  state.current++;

  // UI update
  document.getElementById('question-text').innerHTML =
    `<span>${state.q.a}</span><span class="op">×</span><span>${state.q.b}</span><span class="op">=</span><span class="ans">?</span>`;

  document.getElementById('qnum-val').textContent = `${state.current}/${state.totalQ}`;
  document.getElementById('progress-bar').style.width = `${(state.current / state.totalQ) * 100}%`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  updateInfoBar();

  if (state.mode === 'choice') {
    document.getElementById('choices-area').style.display = 'grid';
    document.getElementById('input-area').style.display = 'none';
    renderChoices();
  } else {
    document.getElementById('choices-area').style.display = 'none';
    document.getElementById('input-area').style.display = 'flex';
    const inp = document.getElementById('answer-input');
    inp.value = '';
    inp.className = '';
    inp.focus();
  }

  startTimer();
}

function renderChoices() {
  const choices = generateChoices(state.q.answer);
  const area = document.getElementById('choices-area');
  area.innerHTML = '';
  choices.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = v;
    btn.onclick = () => checkAnswer(v, btn);
    area.appendChild(btn);
  });
}

function startTimer() {
  document.getElementById('timer-val').textContent = state.timeLeft;
  timer = setInterval(() => {
    state.timeLeft--;
    document.getElementById('timer-val').textContent = state.timeLeft;
    if (state.timeLeft <= 3) document.getElementById('timer-val').style.color = '#ef4444';
    else document.getElementById('timer-val').style.color = '#f59e0b';
    if (state.timeLeft <= 0) {
      clearInterval(timer);
      if (!state.answered) timeUp();
    }
  }, 1000);
}

function timeUp() {
  state.answered = true;
  showFeedback(false, `⏰ 時間到！答案是 ${state.q.a} × ${state.q.b} = ${state.q.answer}`);
  recordWrong();
  setTimeout(nextQuestion, 1800);
}

function checkAnswer(val, btnEl) {
  if (state.answered) return;
  clearInterval(timer);
  state.answered = true;
  const correct = val === state.q.answer;

  if (btnEl) {
    document.querySelectorAll('.choice-btn').forEach(b => b.onclick = null);
    btnEl.classList.add(correct ? 'correct' : 'wrong');
    if (!correct) {
      document.querySelectorAll('.choice-btn').forEach(b => {
        if (parseInt(b.textContent) === state.q.answer) b.classList.add('correct');
      });
    }
  }

  if (correct) {
    recordCorrect();
    showFeedback(true, getPositiveMsg());
    setTimeout(nextQuestion, 900);
  } else {
    recordWrong();
    showFeedback(false, `❌ 答案是 ${state.q.answer}，做 ${state.punishCount} 下${state.punishment}！`);
    showPunishmentOverlay(state.q.a, state.q.b, state.q.answer);
    setTimeout(nextQuestion, 2500);
  }
}

function submitInput() {
  const val = parseInt(document.getElementById('answer-input').value);
  if (isNaN(val)) return;
  const inp = document.getElementById('answer-input');
  clearInterval(timer);
  state.answered = true;
  const correct = val === state.q.answer;
  inp.className = correct ? 'correct' : 'wrong';
  document.getElementById('submit-btn').disabled = true;

  if (correct) {
    recordCorrect();
    showFeedback(true, getPositiveMsg());
    setTimeout(() => { document.getElementById('submit-btn').disabled = false; nextQuestion(); }, 900);
  } else {
    recordWrong();
    showFeedback(false, `❌ 答案是 ${state.q.answer}，做 ${state.punishCount} 下${state.punishment}！`);
    showPunishmentOverlay(state.q.a, state.q.b, state.q.answer);
    setTimeout(() => { document.getElementById('submit-btn').disabled = false; nextQuestion(); }, 2500);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && state.mode === 'input' && !state.answered) submitInput();
});

function recordCorrect() {
  state.correct++;
  state.streak++;
  if (state.streak > state.maxStreak) state.maxStreak = state.streak;
  const bonus = state.streak >= 5 ? 20 : state.streak >= 3 ? 15 : 10;
  state.score += bonus;
  updateInfoBar();
}

function recordWrong() {
  state.wrong++;
  state.streak = 0;
  state.lives--;
  const p = `${state.q.a} × ${state.q.b} = ${state.q.answer} → ${state.punishCount} 下 ${state.punishment}`;
  state.punishments.push(p);
  updateInfoBar();
  updatePunishmentLog();

  const card = document.getElementById('question-card');
  card.classList.remove('shake-anim');
  void card.offsetWidth;
  card.classList.add('shake-anim');
}

function updateInfoBar() {
  document.getElementById('score-val').textContent   = state.score;
  document.getElementById('streak-val').textContent  = `🔥${state.streak}`;
  document.getElementById('lives-val').textContent   = '❤️'.repeat(Math.max(0, state.lives));
}

function updatePunishmentLog() {
  if (state.punishments.length === 0) return;
  const log = document.getElementById('punishment-log');
  const list = document.getElementById('punishment-list');
  log.style.display = 'block';
  list.innerHTML = state.punishments.map(p => `<li>• ${p}</li>`).join('');
}

function showFeedback(correct, msg) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback ' + (correct ? 'correct' : 'wrong');
}

function getPositiveMsg() {
  const msgs = ['✅ 正確！', '🎉 答對了！', '⚡ 太快了！', '🔥 連勝！', '👏 完美！'];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

function showPunishmentOverlay(a, b, ans) {
  const ov = document.getElementById('punishment-overlay');
  document.getElementById('punishment-text').textContent = `❌ 答錯了！`;
  document.getElementById('punishment-detail').textContent =
    `${a} × ${b} = ${ans}\n需要做 ${state.punishCount} 下${state.punishment}！`;
  ov.classList.add('show');
  setTimeout(() => ov.classList.remove('show'), 2200);
}

function skipQuestion() {
  if (state.answered) return;
  clearInterval(timer);
  state.answered = true;
  showFeedback(false, `⏭ 跳過 — 答案是 ${state.q.answer}`);
  state.streak = 0;
  updateInfoBar();
  setTimeout(nextQuestion, 1000);
}

function endGame() {
  clearInterval(timer);
  document.getElementById('game-panel').style.display = 'none';
  document.getElementById('result-panel').style.display = 'block';

  const acc = state.correct / (state.correct + state.wrong || 1);
  let grade, title;
  if (acc >= 0.9) { grade = '🏆'; title = '超厲害！九九乘法之神！'; }
  else if (acc >= 0.7) { grade = '🥈'; title = '不錯嘛！再練練就完美了'; }
  else if (acc >= 0.5) { grade = '🥉'; title = '還有進步空間！'; }
  else { grade = '💀'; title = '今天的懲罰有點多...'; }

  document.getElementById('result-grade').textContent = grade;
  document.getElementById('result-title').textContent = title;
  document.getElementById('res-correct').textContent  = state.correct;
  document.getElementById('res-wrong').textContent    = state.wrong;
  document.getElementById('res-score').textContent    = state.score;
  document.getElementById('res-streak').textContent   = state.maxStreak;

  if (state.punishments.length > 0) {
    const ps = document.getElementById('res-punishment');
    ps.style.display = 'block';
    document.getElementById('res-punishment-list').innerHTML =
      state.punishments.map(p => `<li>• ${p}</li>`).join('');
  }
}

function playAgain() {
  document.getElementById('result-panel').style.display   = 'none';
  document.getElementById('punishment-log').style.display = 'none';
  document.getElementById('punishment-list').innerHTML    = '';
  document.getElementById('res-punishment').style.display = 'none';
  document.getElementById('setup-panel').style.display   = 'block';
}
</script>
</body>
</html>
